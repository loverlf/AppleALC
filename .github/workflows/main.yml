name: CI

# 只保留手动触发：Actions 页面点 "Run workflow" 才会跑，push/PR 不再自动构建
on:
  workflow_dispatch:

env:
  PROJECT_TYPE: KEXT
  ACID32: 1

jobs:
  build:
    name: Build
    runs-on: macos-latest
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v5

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v5
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Lilu Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      # 只要 Release 产物；去掉上游的 Debug 构建和两个 analyze 任务，省掉约 3/4 的 macOS 计费分钟
      - name: Build Release
        run: xcodebuild -jobs 1 -configuration Release -arch ACID32 -arch x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AppleALC-Release-run${{ github.run_number }}
          path: build/*/*.zip
